<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Página não encontrada · Hand Games</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/tokens.css?v=2">
  <link rel="stylesheet" href="/css/layout.css?v=2">
  <link rel="stylesheet" href="/css/components.css?v=2">
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sp-6);
      gap: var(--sp-4);
    }
    .error-code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--clr-primary), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .error-title {
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--clr-text);
      margin: 0;
    }
    .error-sub {
      color: var(--clr-text-subtle);
      font-size: var(--text-base);
      max-width: 30ch;
    }
    .game-links {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-3);
      justify-content: center;
      margin-top: var(--sp-2);
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <h1 class="error-title">Página não encontrada</h1>
  <p class="error-sub">Essa URL não existe, mas há jogos esperando por você.</p>

  <a href="/pt/" class="btn btn-primary">🏠 Voltar ao início</a>

  <div class="game-links">
    <a href="/rps/pt/vs-cpu" class="btn btn-ghost">✊ Pedra Papel Tesoura</a>
    <a href="/chopsticks/pt/vs-cpu" class="btn btn-ghost">🖐 Pauzinhos</a>
    <a href="/morra/pt/vs-cpu" class="btn btn-ghost">🤚 Morra</a>
    <a href="/odd-even/pt/vs-cpu" class="btn btn-ghost">🎲 Par ou Ímpar</a>
    <a href="/rpsls/pt/vs-cpu" class="btn btn-ghost">🦎 RPSLS</a>
  </div>
</body>
</html>
